name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: balu
          POSTGRES_PASSWORD: balu
          POSTGRES_DB: balu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql+psycopg://balu:balu@localhost:5432/balu_test
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run pytest -q

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck, test
        run: |
          pnpm -r build
          pnpm -r typecheck
          pnpm -r test
